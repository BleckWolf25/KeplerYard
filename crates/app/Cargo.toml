[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version = "1.97.1"
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
kepler_core = { package = "core", path = "../core" }
bevy = { version = "0.20.1", default-features = false, features = ["2d", "ui", "file_watcher"] }
ron = "0.12"
serde = { version = "1.0", features = ["derive"] }

[features]
default = []
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]
profile = ["bevy/trace_tracy"]