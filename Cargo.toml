[workspace]
members = ["crates/app", "crates/core"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["BleckWolf25"]
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Strict runtime
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Bevy ECS ergonomics
type_complexity = "allow"
too_many_arguments = "allow"
needless_pass_by_value = "allow"

# Intentional f64 <-> f32 physics-to-render & UI pixel conversions
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
suboptimal_flops = "allow"
module_name_repetitions = "allow"

[profile.dev]
opt-level = 1

# Compile Bevy, RON, and core at full speed so 120 Hz physics & shaders never stutter in debug
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.core]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"