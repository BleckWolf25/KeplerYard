[workspace]
resolver = "3"
members = [
    "crates/sim_core",
    "crates/kepler_app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["BleckWolf25"]
license = "MIT"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
